# Blueprint do Render (render.com/docs/blueprint-spec). Tudo free e na mesma região.
databases:
  - name: v4-dashboard-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"
    databaseName: v4_dashboard
    user: v4

services:
  # A imagem roda as migrations (dist/migrate.js) e depois o server, na porta $PORT do Render.
  - type: web
    name: v4-dashboard-api
    runtime: docker
    plan: free
    region: oregon
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: v4-dashboard-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SETTINGS_SECRET
        generateValue: true
      # Origem do front (sem barra no fim). Mudou o nome/domínio do web? Atualize aqui.
      - key: CORS_ORIGIN
        value: https://v4-dashboard-web.onrender.com
      - key: NODE_ENV
        value: production

  # O Render repassa as env vars como build args: NEXT_PUBLIC_API_URL entra no ARG do Dockerfile.
  - type: web
    name: v4-dashboard-web
    runtime: docker
    plan: free
    region: oregon
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    healthCheckPath: /login
    envVars:
      # Embutida no build do front: mudou o domínio da api? Atualize aqui (dispara rebuild).
      - key: NEXT_PUBLIC_API_URL
        value: https://v4-dashboard-api.onrender.com
