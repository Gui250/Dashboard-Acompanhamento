# Blueprint do Render (render.com/docs/blueprint-spec). Web services free, mesma região.
# O banco é externo (Neon): DATABASE_URL é preenchida no painel do Render, nunca neste arquivo.

services:
  # A imagem roda as migrations (dist/migrate.js) e depois o server, na porta $PORT do Render.
  - type: web
    name: v4-dashboard-api
    runtime: docker
    plan: free
    region: oregon
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    envVars:
      # URL do Postgres (Neon). sync: false = o Blueprint não sobrescreve o valor do painel.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SETTINGS_SECRET
        generateValue: true
      # Origem do front (sem barra no fim). Mudou o nome/domínio do web? Atualize aqui.
      - key: CORS_ORIGIN
        value: https://v4-dashboard-web.onrender.com
      - key: NODE_ENV
        value: production
      # Google Ads (opcional): segredos preenchidos no painel. O redirect tem que estar cadastrado no OAuth client.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_ADS_DEVELOPER_TOKEN
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://v4-dashboard-api.onrender.com/integrations/google/callback
      # E-mail de aprovação do kanban via Resend: RESEND_FROM de domínio verificado (ex.: Kanban V4 <kanban@v4company.com>).
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      # Chave do servidor MCP (/mcp): copie do painel para configurar os clientes.
      - key: MCP_API_KEY
        generateValue: true

  # O Render repassa as env vars como build args: NEXT_PUBLIC_API_URL entra no ARG do Dockerfile.
  - type: web
    name: v4-dashboard-web
    runtime: docker
    plan: free
    region: oregon
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    healthCheckPath: /login
    envVars:
      # Embutida no build do front: mudou o domínio da api? Atualize aqui (dispara rebuild).
      - key: NEXT_PUBLIC_API_URL
        value: https://v4-dashboard-api.onrender.com
